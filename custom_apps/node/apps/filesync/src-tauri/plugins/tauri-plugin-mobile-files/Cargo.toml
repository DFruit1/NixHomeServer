[package]
name = "tauri-plugin-mobile-files"
version = "0.1.0"
authors = [ "NixHomeServer" ]
description = ""
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-mobile-files"

[dependencies]
tauri = { version = "2.11.3" }
serde = "1.0"
serde_json = "1.0"
sha2 = "0.10.9"
thiserror = "2"
tauri-plugin-dialog = "2"
uuid = { version = "1.18.1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
