[package]
name = "filesync"
version = "0.1.4"
description = "NixHomeServer file sync client"
edition = "2021"
publish = false

[lib]
name = "filesync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22.1"
futures-util = "0.3.31"
jsonwebtoken = "9.3.1"
rand = "0.8.5"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-deep-link = "2.3.0"
tauri-plugin-opener = "2.5.0"
tauri-plugin-mobile-files = { path = "plugins/tauri-plugin-mobile-files" }
tokio = { version = "1.48.0", features = ["fs", "io-util", "time"] }
tokio-util = { version = "0.7.16", features = ["io"] }
uuid = { version = "1.19.0", features = ["v4"] }
url = "2.5.7"

[workspace]
