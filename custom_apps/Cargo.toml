[workspace]
resolver = "2"

members = [
  "rust/apps/ai-gate",  "rust/apps/browsertrix-downloader",
  "rust/apps/groundwater-server",
  "rust/apps/kanidm-canary-bootstrap",
  "rust/apps/mail-archive-ui",
  "rust/apps/media-manager",
  "rust/apps/filesync-api",
  "rust/apps/ipfs-alias",
  "rust/apps/opencloud-share-gate",
  "rust/apps/search",
  "rust/lib-rs",
  "mkvmaker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Fewer/faster release binaries for the CPU-heavy scanning, probing and parsing
# paths (ffprobe refresh, hashing, PDF/mail extraction). Thin LTO keeps link
# time and memory bounded against the shared crane dependency artifacts.
#
# The dependency graph (~590 crates) is compiled with 16 codegen units so the
# shared crane buildDepsOnly artifacts build in parallel (measured on 4 cores:
# 9m29s -> 9m01s wall / 31m51s -> 29m54s CPU for the workspace deps
# derivation), while the first-party crates below stay pinned to a single unit
# for maximum runtime speed — same release settings as before this split, so
# the ffprobe/hashing/extraction binaries are unaffected.
[profile.release]
lto = "thin"
codegen-units = 16

# First-party workspace members: keep the single-unit release codegen.
# Keep in sync with [workspace.members].
[profile.release.package.ai-gate]
codegen-units = 1

[profile.release.package.browsertrix-downloader]
codegen-units = 1

[profile.release.package.filesync-api]
codegen-units = 1

[profile.release.package.groundwater-server]
codegen-units = 1

[profile.release.package.homelab-common]
codegen-units = 1

[profile.release.package.ipfs-alias]
codegen-units = 1

[profile.release.package.kanidm-canary-bootstrap]
codegen-units = 1

[profile.release.package.mail-archive-ui]
codegen-units = 1

[profile.release.package.media-manager]
codegen-units = 1

[profile.release.package.opencloud-share-gate]
codegen-units = 1

[profile.release.package.search]
codegen-units = 1

[workspace.dependencies]
homelab-common = { path = "rust/lib-rs" }
anyhow = "1.0.104"
axum = "0.8.6"
cap-std = "3.4.2"
http = "1.3.1"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = "3.5.2"
data-encoding = "2.9.0"
dialoguer = { version = "0.11.0", features = ["fuzzy-select"] }
flate2 = { version = "1.1.2", default-features = false, features = ["rust_backend"] }
form_urlencoded = "1.2.2"
fs2 = "0.4.3"
futures-util = "0.3.31"
html2text = "0.14.1"
hmac = "0.12.1"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
kanidm_client = "1.10.4"
kanidm_proto = "1.10.4"
jsonwebtoken = "9.3.1"
landlock = "0.4.4"
libc = "0.2.177"
lofty = "0.24.0"
mailparse = "0.16.1"
md-5 = "0.10.6"
postgres = "0.19.12"
rand = "0.8.5"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
# MQTT client for the groundwater platform's ingest path. The workspace had no
# MQTT client before this app; rumqttc is the smallest maintained async client
# that covers MQTT 3.1.1 QoS 0/1/2 without embedding a broker.
rumqttc = { version = "0.25.1", default-features = false, features = [
  "use-rustls",
] }
roxmltree = "0.21.1"
rusqlite = { version = "0.40.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.27.0"
tokio = "1.51.0"
tokio-postgres = "0.7.17"
tokio-util = { version = "0.7.17", features = ["io"] }
tower = { version = "0.5.2", features = ["util"] }
url = "2.5.7"
zeroize = "1.9.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
uuid = { version = "1.19.0", features = ["v4"] }
