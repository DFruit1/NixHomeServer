[workspace]
resolver = "2"

members = [
  "rust/apps/browsertrix-downloader",
  "rust/apps/kanidm-canary-bootstrap",
  "rust/apps/mail-archive-ui",
  "rust/apps/media-manager",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
axum = "0.8.6"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
data-encoding = "2.9.0"
form_urlencoded = "1.2.2"
hmac = "0.12.1"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
kanidm_client = "1.10.4"
kanidm_proto = "1.10.4"
landlock = "0.4.4"
libc = "0.2.177"
lofty = "0.24.0"
mailparse = "0.16.1"
md-5 = "0.10.6"
rand = "0.8.5"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
roxmltree = "0.21.1"
rusqlite = { version = "0.40.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.27.0"
tokio = "1.51.0"
tokio-util = { version = "0.7.17", features = ["io"] }
tower = { version = "0.5.2", features = ["util"] }
url = "2.5.7"
zeroize = "1.9.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
