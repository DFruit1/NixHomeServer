[package]
name = "ai-tools"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
reqwest = { workspace = true, default-features = false, features = ["json", "multipart", "rustls-tls"] }
rmcp = { version = "3.5.0", default-features = false, features = [
  "macros",
  "server",
  "tower",
  "transport-streamable-http-server",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { workspace = true, features = ["util"] }