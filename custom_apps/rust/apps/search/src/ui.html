<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --surface: #f6f6f4;
    --surface-hover: #ecece8;
    --border: #d8d8d3;
    --control-border: #858990;
    --text: #16181d;
    --text-muted: #5c6068;
    --accent: #1c5d99;
    --accent-contrast: #ffffff;
    --selected: #ddeaf6;
    --mark: #ffe08a;
    --error: #a22b24;
    --focus: #1c5d99;
    --radius: 8px;
    --radius-sm: 6px;
    --space-1: 0.25rem;
    --space-2: 0.5rem;
    --space-3: 0.75rem;
    --space-4: 1rem;
    --space-5: 1.5rem;
    --space-6: 2rem;
    --space-7: 3rem;
    --control-height: 2.75rem;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --surface: #1f2228;
      --surface-hover: #292d35;
      --border: #3a3f48;
      --control-border: #737b88;
      --text: #eceef2;
      --text-muted: #a5abb5;
      --accent: #86bff3;
      --accent-contrast: #0b1220;
      --selected: #23384d;
      --mark: #6c5114;
      --error: #ffaaa1;
      --focus: #86bff3;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 1rem/1.5 var(--font); }
  ::selection { background: var(--selected); color: var(--text); }
  button, input, select, summary, a { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  a { color: var(--accent); text-underline-offset: 0.2em; }
  button, input, select { font: inherit; color: inherit; min-width: 0; }
  button, select, input { min-height: var(--control-height); border: 1px solid var(--control-border); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); background: var(--bg); }
  input, select { width: 100%; }
  input::placeholder { color: var(--text-muted); opacity: 1; }
  input { caret-color: var(--accent); }
  button { cursor: pointer; }
  button:hover:not(:disabled), summary:hover { background: var(--surface-hover); }
  button:active:not(:disabled) { background: var(--selected); }
  button:disabled, button[aria-disabled="true"] { opacity: 0.55; cursor: wait; }
  button[type="submit"] { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); font-weight: 600; }
  button[type="submit"]:hover { filter: brightness(1.1); background: var(--accent); }
  .shell { max-width: 76rem; margin: auto; padding: 0 var(--space-6) var(--space-7); }
  header { display: flex; align-items: center; justify-content: space-between; padding: var(--space-5) 0; margin-bottom: var(--space-5); border-bottom: 1px solid var(--border); }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.02em; }
  h2 { font-size: 1.125rem; margin: 0; font-weight: 600; }
  p { margin: 0; }
  .ghost { background: transparent; border-color: transparent; }
  .muted { color: var(--text-muted); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .search__row { position: relative; display: flex; gap: var(--space-2); }
  #query { flex: 1; font-size: 1.125rem; padding: var(--space-3) var(--space-4); }
  .search-tools { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; margin-top: var(--space-3); }
  .source-field { display: flex; align-items: center; gap: var(--space-2); flex: 1 1 16rem; max-width: 25rem; min-width: 0; }
  .source-field select { flex: 1; }
  #filterToggle[aria-expanded="true"] { background: var(--selected); border-color: var(--accent); }
  .active-filters { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin-top: var(--space-3); }
  .active-filter { display: inline-flex; align-items: baseline; gap: var(--space-2); font-size: 0.875rem; background: var(--selected); border-color: var(--border); max-width: 100%; overflow-wrap: anywhere; text-align: left; }
  .active-filter span { color: var(--text-muted); font-size: 0.75rem; }
  .workspace { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-6); margin-top: var(--space-6); align-items: start; }
  .workspace[data-filters-open="true"] { grid-template-columns: 16rem minmax(0, 1fr); }
  .workspace > * { min-width: 0; }
  .filter-panel { border-right: 1px solid var(--border); padding-right: var(--space-5); }
  .filter-panel h2 { margin-bottom: var(--space-4); }
  #showResults { display: none; }
  .field { display: flex; flex-direction: column; gap: var(--space-1); margin-bottom: var(--space-4); }
  .field > span { font-size: 0.875rem; }
  .filter-note { font-size: 0.8125rem; color: var(--text-muted); margin-bottom: var(--space-4); }
  .result-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-4); }
  .result-options { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
  .result-options label { display: flex; align-items: center; gap: var(--space-2); font-size: 0.875rem; }
  .result-options select { width: auto; }
  #status { color: var(--text-muted); font-size: 0.875rem; }
  .results { list-style: none; padding: 0; margin: 0; }
  .result { padding: var(--space-5) 0; border-bottom: 1px solid var(--border); }
  .result:first-child { padding-top: var(--space-2); }
  .result__context { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-2); color: var(--text-muted); font-size: 0.8125rem; margin-bottom: var(--space-1); overflow-wrap: anywhere; }
  .result__source { font-weight: 600; }
  .result__title { display: inline-block; font-size: 1.125rem; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; text-decoration: none; }
  .result h3 { margin: 0; font-size: inherit; line-height: 1.4; }
  a.result__title:hover { text-decoration: underline; }
  .result__snippet { margin-top: var(--space-2); max-width: 75ch; overflow-wrap: anywhere; }
  .result__snippet em { font-style: normal; font-weight: 600; background: var(--mark); color: var(--text); }
  .result__details { margin-top: var(--space-2); font-size: 0.8125rem; color: var(--text-muted); overflow-wrap: anywhere; }
  .result__details summary { display: inline-block; cursor: pointer; padding: var(--space-1) 0; text-decoration: underline; text-underline-offset: 0.2em; }
  .result__details p { margin-top: var(--space-2); }
  .empty { padding: var(--space-7) 0; }
  .empty h2 { font-size: 1.5rem; margin-bottom: var(--space-2); letter-spacing: -0.02em; }
  .more { display: flex; justify-content: center; margin-top: var(--space-5); }
  .notice { margin-top: var(--space-3); color: var(--error); overflow-wrap: anywhere; }
  .notice button { margin-top: var(--space-2); }
  .source-health { color: var(--text-muted); margin-top: var(--space-4); font-size: 0.875rem; }
  .source-health summary { cursor: pointer; padding: var(--space-2) 0; }
  .source-health ul { padding-left: var(--space-5); }
  @media (max-width: 48rem) {
    .shell { padding-inline: var(--space-4); }
    header { margin-bottom: var(--space-4); padding-block: var(--space-4); }
    .workspace[data-filters-open="true"] { grid-template-columns: minmax(0, 1fr); }
    .filter-panel { border-right: 0; border-bottom: 1px solid var(--border); padding-right: 0; padding-bottom: var(--space-4); }
    #showResults { display: block; width: 100%; }
    .filter-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--space-3); }
    .result-tools { align-items: flex-start; }
    .source-field { max-width: none; }
  }
  @media (max-width: 24rem) {
    .search__row { flex-wrap: wrap; }
    #query { flex-basis: 100%; }
    .search__row button { width: 100%; }
    .source-field { flex-basis: 100%; }
    .filter-fields { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<!--LOGOUT_URL-->
<div class="shell">
<header>
  <h1>Search</h1>
  <button type="button" class="ghost" id="signOut">Sign out</button>
</header>
<main>
  <form id="searchForm" role="search">
    <div class="search__row">
      <label class="sr-only" for="query">Search terms</label>
      <input id="query" type="search" placeholder="Search your server…" maxlength="2048" autocomplete="off" autofocus aria-keyshortcuts="Control+k Meta+k">
      <button type="submit">Search</button>
    </div>
    <div class="search-tools">
      <label class="source-field" for="kind">Type
        <select id="kind"><option value="">All saved types</option></select>
      </label>
      <label class="source-field" for="source" id="sourceField">Source
        <select id="source"><option value="">All sources</option></select>
      </label>
      <button type="button" id="filterToggle" aria-expanded="false" aria-controls="filtersPanel">Filters</button>
      <button type="button" class="ghost" id="clearFilters" hidden>Clear filters</button>
    </div>
    <div class="active-filters" id="activeFilters" aria-label="Active filters" hidden></div>
  </form>
  <p id="sourcesError" class="notice" role="status" hidden></p>
  <details class="source-health" id="sourceHealth" hidden><summary>Source sync issues</summary><ul id="sourceIssues"></ul></details>
  <div class="workspace" id="workspace">
    <aside class="filter-panel" id="filtersPanel" aria-label="Search filters" hidden>
      <h2>Refine results</h2>
      <p class="filter-note">Counts show library matches and sampled live matches separately.</p>
      <div class="filter-fields">
        <label class="field"><span>Format</span><select id="type"><option value="">All formats</option></select></label>
        <label class="field"><span>Owner</span><select id="owner"><option value="">All owners</option></select></label>
        <label class="field"><span>Author</span><select id="author"><option value="">All authors</option></select></label>
        <label class="field"><span>Tag</span><select id="tag"><option value="">All tags</option></select></label>
        <label class="field"><span>Series</span><select id="series"><option value="">All series</option></select></label>
        <label class="field"><span>Year</span><select id="year"><option value="">All years</option></select></label>
        <label class="field"><span>Content date, from</span><input id="after" type="date"></label>
        <label class="field"><span>Content date, to</span><input id="before" type="date"></label>
      </div>
      <button type="button" id="showResults">Show results</button>
    </aside>
    <section id="resultsRegion" aria-labelledby="resultsHeading" tabindex="-1">
      <h2 id="resultsHeading" class="sr-only">Search results</h2>
      <div class="result-tools" id="resultTools" hidden>
        <p id="status" role="status"></p>
        <div class="result-options">
          <label>Sort <select id="sort"><option value="relevance">Relevance</option><option value="newest">Newest first</option></select></label>
          <label id="pageSizeField">Per page <select id="pageSize"><option value="25" selected>25</option><option value="50">50</option><option value="100">100</option></select></label>
        </div>
      </div>
      <div class="empty" id="emptyState"><h2 id="emptyTitle">Search across your server</h2><p class="muted" id="emptyMessage">Enter a title, phrase, name or topic.</p></div>
      <div class="notice" id="searchError" role="alert" hidden><p id="errorMessage"></p><button type="button" id="retrySearch">Retry search</button></div>
      <details class="source-health" id="searchCoverage" hidden><summary>Search coverage</summary><p id="coverageText"></p></details>
      <div class="notice" id="liveError" role="status" hidden><p id="liveErrorMessage"></p><button type="button" id="retryLive">Retry connected sources</button></div>
      <ul class="results" id="results" aria-label="Search results"></ul>
      <div class="more" id="moreWrap" hidden><button type="button" id="loadMore">Load more results</button></div>

    </section>
  </div>
</main>
</div>
<script>
const el = id => document.getElementById(id);
const queryEl = el('query');
const sourceEl = el('source');
const ownerEl = el('owner');
const typeEl = el('type');
const afterEl = el('after');
const beforeEl = el('before');
const sortEl = el('sort');
const pageSizeEl = el('pageSize');
const resultsEl = el('results');
const statusEl = el('status');
const controls = { source: sourceEl, kind: el('kind'), type: typeEl, owner: ownerEl, author: el('author'), tag: el('tag'), series: el('series'), year: el('year'), after: afterEl, before: beforeEl };
const filterLabels = { source: 'Source', kind: 'Type', type: 'Format', owner: 'Owner', author: 'Author', tag: 'Tag', series: 'Series', year: 'Year', after: 'From', before: 'To' };
const kindLabels = { email: 'Email', document: 'Document', book: 'Book', 'web-page': 'Web page', 'zim-article': 'Offline article', 'zim-archive': 'Offline archive', video: 'Video', audiobook: 'Audiobook' };
if (window.SEARCH_ONLINE_PAPERS) kindLabels['online-paper'] = 'Online papers';
const formatLabels = { 'message/rfc822': 'Email', 'application/pdf': 'PDF', 'text/html': 'Web page', 'application/epub+zip': 'EPUB', 'text/plain': 'Text' };
const sourceNames = new Map();
sourceNames.set('online-papers', 'Online papers');
const state = { hits: [], liveHits: [], page: 0, total: 0, hasMore: false, generation: 0, controller: null, submitted: null, loading: false, liveLoading: false,
  indexedDone: false, liveDone: false, indexedFailed: false, liveFailed: false, indexedFacets: {}, liveFacets: {}, resultNodes: new Map() };

function safeHref(value) {
  if (!value) return '';
  try { const url = new URL(value, location.origin); return ['http:', 'https:'].includes(url.protocol) ? url.href : ''; } catch { return ''; }
}
function option(value, label) {
  const node = document.createElement('option'); node.value = value; node.textContent = label; return node;
}
function fillSelect(select, options, allLabel) {
  const current = select.value;
  if (current && !options.some(item => item.value === current)) options = [{value: current, label: current}, ...options];
  select.replaceChildren(option('', allLabel), ...options.map(item => option(item.value, item.label)));
  select.value = current;
}
function setSelectValue(select, value) {
  if (value && !Array.from(select.options).some(item => item.value === value)) select.appendChild(option(value, value));
  select.value = value || '';
}
function displayValue(key, value) {
  if (key === 'source') return sourceNames.get(value) || value;
  if (key === 'kind') return kindLabels[value] || value;
  if (key === 'type') return formatLabels[value] || value;
  return value;
}
function onlinePapers(submitted = state.submitted) {
  return new URLSearchParams(submitted || '').get('kind') === 'online-paper';
}
function updateSearchMode() {
  const online = controls.kind.value === 'online-paper';
  for (const [key, control] of Object.entries(controls)) control.disabled = online && key !== 'kind';
  el('sourceField').hidden = online;
  el('filterToggle').hidden = online;
  el('pageSizeField').hidden = online;
  el('sourcesError').hidden = online || !el('sourcesError').textContent;
  el('sourceHealth').hidden = online || !el('sourceIssues').children.length;
  queryEl.placeholder = online ? 'Search online papers…' : 'Search your server…';
  if (online) toggleFilters(false);
}
function params() {
  const p = new URLSearchParams();
  if (queryEl.value.trim()) p.set('q', queryEl.value.trim());
  for (const [key, control] of Object.entries(controls)) if (!control.disabled && control.value) p.set(key, control.value);
  if (sortEl.value === 'newest') p.set('sort', 'newest');
  if (controls.kind.value !== 'online-paper' && pageSizeEl.value && pageSizeEl.value !== '25') p.set('pageSize', pageSizeEl.value);
  // The API default remains 50 for existing callers; this UI starts with 25.
  return p;
}
function updateActiveFilters() {
  const container = el('activeFilters');
  container.replaceChildren();
  for (const [key, control] of Object.entries(controls)) {
    if (control.disabled || !control.value) continue;
    const value = displayValue(key, control.value);
    const button = document.createElement('button');
    button.type = 'button'; button.className = 'active-filter';
    button.textContent = `${filterLabels[key]}: ${value}`;
    button.setAttribute('aria-label', `Remove ${filterLabels[key].toLowerCase()} filter: ${value}`);
    const remove = document.createElement('span'); remove.textContent = 'Remove'; button.appendChild(remove);
    button.addEventListener('click', () => {
      control.value = ''; runSearch();
      (el('activeFilters').children[0] || el('filterToggle')).focus();
    });
    container.appendChild(button);
  }
  container.hidden = container.children.length === 0;
  el('clearFilters').hidden = container.hidden;
}
function toggleFilters(open = el('filterToggle').getAttribute('aria-expanded') !== 'true') {
  el('filterToggle').setAttribute('aria-expanded', String(open));
  el('filtersPanel').hidden = !open;
  el('workspace').setAttribute('data-filters-open', String(open));
}
function renderFacets(data, scope = 'indexed') {
  state[scope === 'live' ? 'liveFacets' : 'indexedFacets'] = data;
  const dimensions = { owner: 'ownerFacets', kind: 'kindFacets', type: 'contentTypeFacets', author: 'authorFacets', tag: 'tagFacets', series: 'seriesFacets', year: 'yearFacets' };
  for (const [key, field] of Object.entries(dimensions)) {
    const values = new Map();
    for (const [scope, facets] of [['library', state.indexedFacets], ['live', state.liveFacets]]) {
      for (const facet of facets[field] || []) {
        const entry = values.get(String(facet.name)) || {value: String(facet.name), library: 0, live: 0};
        entry[scope] = facet.count; values.set(entry.value, entry);
      }
    }
    const options = [...values.values()].sort((a, b) => (b.library + b.live) - (a.library + a.live) || a.value.localeCompare(b.value)).map(entry => ({
      value: entry.value,
      label: `${displayValue(key, entry.value)} (${[entry.library ? `${entry.library} library` : '', entry.live ? `${entry.live} live` : ''].filter(Boolean).join(' + ')})`,
    }));
    if (key === 'kind') for (const [value, label] of Object.entries(kindLabels)) {
      if (!options.some(item => item.value === value)) options.push({value, label});
    }
    fillSelect(controls[key], options, key === 'kind' ? 'All saved types' : `All ${key === 'type' ? 'formats' : key === 'series' ? 'series' : key + 's'}`);
  }
}

// Raw engine scores are incomparable. Interleave their rank positions instead,
// boost exact title matches, and use real timestamps for the global date sort.
function combinedHits() {
  const groups = [['library', state.hits], ...[...new Set(state.liveHits.map(hit => hit.source || ''))].sort().map(source => [source, state.liveHits.filter(hit => (hit.source || '') === source)])];
  const query = (new URLSearchParams(state.submitted || '').get('q') || '').replace(/^"(.*)"$/, '$1').trim().toLocaleLowerCase();
  const newest = new URLSearchParams(state.submitted || '').get('sort') === 'newest';
  const seen = new Set();
  const ranked = [];
  groups.forEach(([, hits], group) => hits.forEach((hit, rank) => {
    const key = `${hit.source || ''}:${hit.id}`;
    if (seen.has(key)) return;
    seen.add(key);
    ranked.push({ ...hit, _key: key, _live: group > 0, _rank: rank, _group: group, _exact: Boolean(query) && (hit.title || '').trim().toLocaleLowerCase() === query });
  }));
  const time = hit => Number.isFinite(hit.created) ? hit.created : -Infinity;
  return ranked.sort((a, b) => {
    if (newest && time(a) !== time(b)) return time(a) > time(b) ? -1 : 1;
    if (!newest && a._exact !== b._exact) return a._exact ? -1 : 1;
    return a._rank - b._rank || a._group - b._group || a._key.localeCompare(b._key);
  });
}
function renderCombined() {
  const hits = combinedHits();
  const focused = document.activeElement;
  const restoreFocus = focused && resultsEl.contains(focused);
  const selection = window.getSelection();
  const selectionElement = selection && !selection.isCollapsed ? selection.anchorNode?.parentElement : null;
  let anchor = restoreFocus ? focused.closest('.result') : selectionElement?.closest('.result');
  if (!anchor && resultsEl.getBoundingClientRect().top < 0) {
    anchor = [...resultsEl.children].find(node => {
      const rect = node.getBoundingClientRect(); return rect.bottom > 0 && rect.top < window.innerHeight;
    });
  }
  if (anchor && !resultsEl.contains(anchor)) anchor = null;
  const anchorTop = anchor?.getBoundingClientRect().top;
  const wanted = new Set(hits.map(hit => hit._key));
  for (const [key, node] of state.resultNodes) if (!wanted.has(key)) { node.remove(); state.resultNodes.delete(key); }
  hits.forEach((hit, index) => {
    let node = state.resultNodes.get(hit._key);
    if (!node) { node = resultNode(hit); state.resultNodes.set(hit._key, node); }
    else updateResultNode(node, hit);
    if (resultsEl.children[index] !== node) resultsEl.insertBefore(node, resultsEl.children[index] || null);
  });
  if (restoreFocus && document.activeElement !== focused) {
    (focused.isConnected ? focused : el('resultsRegion')).focus({preventScroll: true});
  }
  if (anchor?.isConnected && anchorTop !== undefined) {
    window.scrollBy(0, anchor.getBoundingClientRect().top - anchorTop);
  }
}
function resultNode(hit) {
  const item = document.createElement('li'); item.className = 'result';
  const context = document.createElement('div'); context.className = 'result__context';
  const source = document.createElement('span'); source.className = 'result__source';
  const info = document.createElement('span'); context.append(source, info);
  const heading = document.createElement('h3');
  const title = document.createElement('a'); title.className = 'result__title'; heading.appendChild(title);
  const snippet = document.createElement('div'); snippet.className = 'result__snippet';
  const details = document.createElement('details'); details.className = 'result__details';
  const summary = document.createElement('summary'); summary.textContent = 'Details';
  const metadataText = document.createElement('p');
  const originLink = document.createElement('a'); originLink.textContent = 'Open original';
  details.append(summary, metadataText, originLink); item.append(context, heading, snippet, details);
  item._parts = {source, info, title, snippet, details, metadataText, originLink};
  updateResultNode(item, hit);
  return item;
}
function updateResultNode(item, hit) {
  const parts = item._parts;
  const text = (node, value) => { if (node.textContent !== value) node.textContent = value; };
  parts.source.dataset.source = hit.source || '';
  text(parts.source, sourceNames.get(hit.source) || hit.source || '');
  const date = Number.isFinite(hit.created) ? new Date(hit.created * 1000).toLocaleDateString(undefined, {year: 'numeric', month: 'short', day: 'numeric'}) : '';
  text(parts.info, [hit._live ? 'Live' : '', formatLabels[hit.contentType] || hit.contentType, hit.owner === 'shared' ? '' : hit.owner, date].filter(Boolean).join(' · '));
  const href = safeHref(hit.appUrl) || safeHref(hit.originUrl);
  text(parts.title, hit.title || 'Untitled');
  if (href) parts.title.href = href; else parts.title.removeAttribute('href');
  parts.snippet.hidden = !hit.snippet;
  // API contract: escaped text, with only generated <em> highlights.
  if (parts.snippet.innerHTML !== (hit.snippet || '')) parts.snippet.innerHTML = hit.snippet || '';
  const metadata = Object.entries(hit.metadata || {}).filter(([key, value]) => key !== 'owner' && value !== null && value !== '');
  text(parts.metadataText, metadata.map(([key, value]) => `${key.replace(/_/g, ' ').replace(/^./, c => c.toUpperCase())}: ${value}`).join(' · '));
  const origin = safeHref(hit.originUrl);
  parts.originLink.hidden = !origin || origin === href;

function syncUrl() {

}
function readUrlState() {

  }
  sortEl.value = p.get('sort') === 'newest' ? 'newest' : 'relevance';
  pageSizeEl.value = ['25', '50', '100'].includes(p.get('pageSize')) ? p.get('pageSize') : '25';

}
async function fetchPage(page, scope, submitted, signal) {

function resetResults() {
  state.hits = []; state.liveHits = []; state.page = 0; state.total = 0; state.hasMore = false;
  state.indexedDone = false; state.liveDone = false; state.indexedFailed = false; state.liveFailed = false;

function updateResultsStatus() {

  statusEl.textContent = count ? `${count.toLocaleString()} match${count === 1 ? '' : 'es'} shown${pending ? ' · searching…' : ''}` : pending ? 'Searching…' : state.indexedFailed && state.liveFailed ? 'Search is unavailable' : failed ? 'No matches from available sources' : 'No matches';
  el('moreWrap').hidden = !state.hasMore;
  el('loadMore').disabled = state.loading;
  el('loadMore').textContent = state.loading ? 'Loading more…' : 'Load more results';
  el('emptyState').hidden = count > 0 || pending || (!state.indexedDone && !state.liveDone);
  el('emptyTitle').textContent = state.indexedFailed && state.liveFailed ? 'Search is unavailable' : state.indexedFailed || !el('liveError').hidden ? 'No matches from available sources' : 'No matches';
  el('emptyMessage').textContent = state.indexedFailed && state.liveFailed ? 'Retry the unavailable sources above, or try again shortly.' : Object.values(controls).some(control => control.value) ? 'Try a broader search or clear some filters.' : 'Try a different phrase or fewer words.';

    el('emptyTitle').textContent = state.liveFailed ? 'Online paper search is unavailable' : failed ? 'No matches from available sources' : 'No matches';
    el('emptyMessage').textContent = state.liveFailed ? 'Retry online papers, or try again shortly.' : 'Try a different phrase or fewer words.';
    el('coverageText').textContent = 'Online scholarly sources are searched through SearXNG. Up to 50 results are shown; full papers are not downloaded or saved. Newest sorts the returned results with known publication dates.';

}
async function runLive(generation, submitted, signal) {

  state.liveLoading = true; state.liveDone = false; state.liveFailed = false;
  if (!retryFocused) el('liveError').hidden = true;

  retry.setAttribute('aria-disabled', 'true'); retry.textContent = 'Retrying…';
  updateResultsStatus();

    const data = await fetchPage(0, 'live', submitted, signal);
    if (generation !== state.generation || !data) return;
    state.liveHits = data.hits || [];
    renderFacets(data, 'live');
    renderCombined();
    const warnings = data.warnings || [];
    if (warnings.length) {

async function runSearch(event, {append = false, pushHistory = true} = {}) {

      return;

    }

}
async function runIndexed(append = false) {
  if (state.loading || !state.submitted) return;
  const retry = el('retrySearch');
  const retryFocused = document.activeElement === retry;
  const generation = state.generation;
  const submitted = state.submitted;
  const signal = state.controller.signal;

  if (!retryFocused) el('searchError').hidden = true;

  retry.setAttribute('aria-disabled', 'true'); retry.textContent = 'Retrying…';
  el('loadMore').disabled = true; el('loadMore').textContent = 'Loading more…';
  try {
    const data = await fetchPage(page, 'indexed', submitted, signal);
    if (generation !== state.generation || !data) return;
    state.page = page; state.total = data.total || 0; state.hasMore = Boolean(data.hasMore);
    const seen = new Set(state.hits.map(hit => hit.id));
    const hits = (data.hits || []).filter(hit => !seen.has(hit.id));
    state.hits.push(...hits);
    renderCombined();
    if (!append) renderFacets(data);
    state.indexedDone = true; state.indexedFailed = false;
    if (document.activeElement === retry) el('resultsRegion').focus({preventScroll: true});
    el('searchError').hidden = true;
  } catch (error) {
    if (generation !== state.generation || signal.aborted) return;
    el('errorMessage').textContent = error.message; el('searchError').hidden = false;
    state.indexedDone = true; if (!append) state.indexedFailed = true;

function clearFilters() { for (const control of Object.values(controls)) control.value = ''; runSearch(); el('filterToggle').focus(); }
async function loadSources() {

    if (!response.ok) throw new Error('Could not load sources. Refresh to try again.');
    const data = await response.json();
    for (const source of data.sources || []) sourceNames.set(source.id, source.displayName || source.id);
    fillSelect(sourceEl, (data.sources || []).map(source => ({value: source.id, label: sourceNames.get(source.id)})), 'All sources');

    for (const node of document.querySelectorAll('[data-source]')) node.textContent = sourceNames.get(node.dataset.source) || node.dataset.source;

el('searchForm').addEventListener('submit', runSearch);
for (const control of [...Object.values(controls), sortEl, pageSizeEl]) control.addEventListener('change', runSearch);

el('clearFilters').addEventListener('click', clearFilters);
