<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --surface: #f6f6f4;
    --surface-hover: #ecece8;
    --border: #d8d8d3;
    --text: #16181d;
    --text-muted: #5c6068;
    --accent: #1c5d99;
    --accent-contrast: #ffffff;
    --selected: #ddeaf6;
    --mark: #ffe08a;
    --focus: #1c5d99;
    --radius: 8px;
    --radius-sm: 6px;
    --space-1: 0.25rem;
    --space-2: 0.5rem;
    --space-3: 0.75rem;
    --space-4: 1rem;
    --space-5: 1.5rem;
    --space-6: 2rem;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --surface: #1f2228;
      --surface-hover: #292d35;
      --border: #3a3f48;
      --text: #eceef2;
      --text-muted: #9aa0aa;
      --accent: #6fb2ef;
      --accent-contrast: #0b1220;
      --selected: #23384d;
      --mark: #7a5c15;
      --focus: #6fb2ef;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    max-width: 64rem;
    padding: var(--space-5) var(--space-4) var(--space-6);
    font-family: var(--font);
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-4);
    margin-bottom: var(--space-5);
  }
  h1 { font-size: 1.4rem; margin: 0; letter-spacing: -0.01em; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .search { display: flex; flex-direction: column; gap: var(--space-3); }
  .search__row { display: flex; gap: var(--space-2); }
  @media (max-width: 300px) {
    .search__row { flex-direction: column; }
  }
  .filters {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
    gap: var(--space-3);
  }
  .field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
  .field > span { font-size: 0.78rem; color: var(--text-muted); }
  .field--range { grid-column: span 2; }
  .range { display: flex; align-items: center; gap: var(--space-2); }
  .range input { flex: 1 1 0; min-width: 0; }
  .range span { color: var(--text-muted); font-size: 0.85rem; }
  .filter-actions { display: flex; justify-content: flex-end; margin-top: var(--space-2); }

  input, select, button {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: var(--space-2) var(--space-3);
    min-width: 0;
  }
  input:hover, select:hover { border-color: var(--text-muted); }
  input:focus-visible, select:focus-visible, button:focus-visible,
  .chip:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }
  #query { flex: 1 1 auto; font-size: 1.05rem; }
  button {
    cursor: pointer;
    transition: background-color 120ms ease, border-color 120ms ease;
  }
  button:hover:not(:disabled) { background: var(--surface-hover); }
  button:disabled { opacity: 0.5; cursor: default; }
  button[type="submit"] {
    background: var(--accent);
    color: var(--accent-contrast);
    border-color: var(--accent);
    font-weight: 600;
    white-space: nowrap;
  }
  button[type="submit"]:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
  .ghost { background: transparent; }

  .facets { margin-top: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }
  .facet-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .facet-row h2 {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin: 0;
    flex: 0 0 4.5rem;
  }
  .chip {
    font: inherit;
    font-size: 0.82rem;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: var(--space-1) var(--space-3);
    cursor: pointer;
  }
  .chip:hover:not(:disabled) { background: var(--surface-hover); }
  .chip[aria-pressed="true"] {
    background: var(--selected);
    border-color: var(--accent);
    font-weight: 600;
  }
  .chip--more { border-style: dashed; color: var(--text-muted); }

  #status { color: var(--text-muted); margin: var(--space-4) 0 0; min-height: 1.25rem; }
  .results { list-style: none; margin: var(--space-2) 0 0; padding: 0; }
  .result { padding: var(--space-3) 0; border-top: 1px solid var(--border); }
  .result:first-child { border-top: none; }
  .result__head { display: flex; align-items: baseline; gap: var(--space-2); flex-wrap: wrap; }
  .result__title { font-size: 1.05rem; color: var(--text); text-decoration: none; word-break: break-word; }
  a.result__title:hover { text-decoration: underline; }
  .badge {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0 var(--space-2);
    white-space: nowrap;
  }
  .result__snippet { margin: var(--space-1) 0; }
  .result__meta { font-size: 0.8rem; color: var(--text-muted); word-break: break-word; }
  .result__details {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-top: 2px;
    word-break: break-word;
  }
  mark { background: var(--mark); color: inherit; }
  .more { display: flex; justify-content: center; margin-top: var(--space-4); }
</style>
</head>
<body>
<!--LOGOUT_URL-->
<header>
  <h1>Search</h1>
  <button type="button" class="ghost" onclick="logout()">Sign out</button>
</header>

<form class="search" id="searchForm">
  <div class="search__row">
    <label class="sr-only" for="query">Search terms</label>
    <input id="query" type="search" placeholder="Search everything…" autocomplete="off" autofocus>
    <button type="submit">Search</button>
  </div>
  <div class="filters">
    <label class="field"><span>User</span>
      <select id="owner"><option value="">All users</option></select>
    </label>
    <label class="field"><span>Source</span>
      <select id="source"><option value="">All sources</option></select>
    </label>
    <label class="field"><span>Content type</span>
      <select id="type"><option value="">All types</option></select>
    </label>
    <label class="field"><span>Sort</span>
      <select id="sort">
        <option value="relevance">Relevance</option>
        <option value="newest">Newest first</option>
      </select>
    </label>
    <label class="field field--range"><span>Date added</span>
      <span class="range">
        <input id="after" type="date" aria-label="Added on or after">
        <span>to</span>
        <input id="before" type="date" aria-label="Added on or before">
      </span>
    </label>
  </div>
  <div class="filter-actions">
    <button type="button" class="ghost" id="clearFilters" hidden>Clear filters</button>
  </div>
</form>

<section class="facets" id="facets" hidden aria-label="Narrow results">
  <div class="facet-row" id="ownerFacets" role="group" aria-labelledby="ownerFacetsHeading"><h2 id="ownerFacetsHeading">Users</h2></div>
  <div class="facet-row" id="sourceFacets" role="group" aria-labelledby="sourceFacetsHeading"><h2 id="sourceFacetsHeading">Sources</h2></div>
  <div class="facet-row" id="kindFacets" role="group" aria-labelledby="kindFacetsHeading"><h2 id="kindFacetsHeading">Kinds</h2></div>
  <div class="facet-row" id="typeFacets" role="group" aria-labelledby="typeFacetsHeading"><h2 id="typeFacetsHeading">Types</h2></div>
  <div class="facet-row" id="authorFacets" role="group" aria-labelledby="authorFacetsHeading"><h2 id="authorFacetsHeading">Authors</h2></div>
  <div class="facet-row" id="tagFacets" role="group" aria-labelledby="tagFacetsHeading"><h2 id="tagFacetsHeading">Tags</h2></div>
  <div class="facet-row" id="seriesFacets" role="group" aria-labelledby="seriesFacetsHeading"><h2 id="seriesFacetsHeading">Series</h2></div>
  <div class="facet-row" id="yearFacets" role="group" aria-labelledby="yearFacetsHeading"><h2 id="yearFacetsHeading">Years</h2></div>
</section>

<p id="status" role="status">Loading sources…</p>
<ul class="results" id="results" aria-label="Search results"></ul>
<div class="more" id="moreWrap" hidden>
  <button type="button" id="loadMore">Load more results</button>
</div>

<script>
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const facetsEl = document.getElementById('facets');
const moreWrap = document.getElementById('moreWrap');
const loadMoreBtn = document.getElementById('loadMore');
const clearBtn = document.getElementById('clearFilters');
const queryEl = document.getElementById('query');
const ownerEl = document.getElementById('owner');
const sourceEl = document.getElementById('source');
const typeEl = document.getElementById('type');
const sortEl = document.getElementById('sort');
const afterEl = document.getElementById('after');
const beforeEl = document.getElementById('before');

// Chip-only filters (the dimensions that have no select control). Owner,
// source, and type reuse their selects above.
const chipFilters = { kind: '', author: '', tag: '', series: '', year: '' };
// Facet dimensions render at most this many chips before offering "Show all".
const FACET_LIMIT = 12;
const expandedFacets = new Set();
let lastFacets = null;

// Results accumulated across pages for the active query, plus its paging state.
const state = { hits: [], page: 0, total: 0, hasMore: false };

// Friendly labels for metadata keys that appear across the different sources.
// Unknown keys fall back to a title-cased, underscore-stripped version so every
// source surfaces its metadata through the same presentation.
const META_LABELS = {
  from: 'From', to: 'To', cc: 'Cc',
  correspondent: 'Correspondent', tags: 'Tags',
  document_type: 'Type', file: 'File',
  feed: 'Feed', author: 'Author',
  archive: 'Archive', entry_path: 'Path', crawl: 'Crawl',
  added: 'Added',
};

function labelFor(key) {
  return META_LABELS[key] || key.replace(/_/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
}

function metaPairs(metadata) {
  if (!metadata || typeof metadata !== 'object') return [];
  return Object.entries(metadata)
    .filter(([, value]) => value !== null && value !== undefined && value !== '')
    .slice(0, 6)
    .map(([key, value]) => `${labelFor(key)}: ${value}`);
}

function fmtDate(epoch) {
  if (!epoch) return '';
  return new Date(epoch * 1000).toLocaleDateString();
}

// Only http(s) targets are linkable. Indexed URLs are attacker-influenced
// content, so a `javascript:` or `data:` URL must never become an href.
function safeHref(value) {
  if (!value) return '';
  try {
    const url = new URL(value, location.origin);
    if (url.protocol === 'http:' || url.protocol === 'https:') return url.href;
  } catch (err) {
    return '';
  }
  return '';
}

function option(value, label) {
  const el = document.createElement('option');
  el.value = value;
  el.textContent = label;
  return el;
}

// Fills a select from `{ value, label }` pairs, preserving the current choice
// even when the new options do not include it (an active filter with no
// matching results must not be silently dropped). Labels let the Source select
// show display names while the value stays the stable source id the API filters
// on.
function fillSelect(select, options, allLabel) {
  const current = select.value;
  const merged = current && !options.some(({ value }) => value === current)
    ? [{ value: current, label: current }, ...options]
    : options;
  select.replaceChildren(option('', allLabel), ...merged.map(({ value, label }) => option(value, label)));
  select.value = current;
}

// Applies a value to a select before its options are known (e.g. restoring a
// filter from the URL), adding a placeholder option so the value is not lost.
function setSelectValue(select, value) {
  if (!value) return;
  if (!Array.from(select.options).some((opt) => opt.value === value)) {
    select.appendChild(option(value, value));
  }
  select.value = value;
}

function facetNames(facets) {
  return (facets || []).map((facet) => ({ value: facet.name, label: facet.name }));
}

function params(page) {
  const p = new URLSearchParams();
  const query = queryEl.value.trim();
  if (query) p.set('q', query);
  if (ownerEl.value) p.set('owner', ownerEl.value);
  if (sourceEl.value) p.set('source', sourceEl.value);
  if (typeEl.value) p.set('type', typeEl.value);
  if (sortEl.value && sortEl.value !== 'relevance') p.set('sort', sortEl.value);
  for (const [key, value] of Object.entries(chipFilters)) {
    if (value) p.set(key, value);
  }
  if (afterEl.value) p.set('after', afterEl.value);
  if (beforeEl.value) p.set('before', beforeEl.value);
  if (page > 0) p.set('page', String(page));
  return p;
}

function anyFilterActive() {
  return Boolean(
    ownerEl.value || sourceEl.value || typeEl.value || afterEl.value || beforeEl.value
    || Object.values(chipFilters).some(Boolean)
  );
}

function updateClearVisibility() {
  clearBtn.hidden = !anyFilterActive();
}

function facetButton(name, count, key) {
  // Built via DOM APIs rather than inline onclick strings: facet values come
  // from indexed content, so they must never be interpolated into markup.
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'chip';
  button.textContent = `${name} (${count})`;
  const targets = { owner: ownerEl, source: sourceEl, type: typeEl };
  const selectTarget = targets[key];
  const active = selectTarget ? selectTarget.value === name : chipFilters[key] === name;
  button.setAttribute('aria-pressed', String(active));
  button.addEventListener('click', () => {
    if (selectTarget) {
      selectTarget.value = selectTarget.value === name ? '' : name;
    } else {
      chipFilters[key] = chipFilters[key] === name ? '' : name;
    }
    runSearch();
  });
  return button;
}

function renderFacets(data) {
  lastFacets = data;
  const rows = [
    ['owner', 'ownerFacets', document.getElementById('ownerFacets')],
    ['source', 'sourceFacets', document.getElementById('sourceFacets')],
    ['kind', 'kindFacets', document.getElementById('kindFacets')],
    ['type', 'contentTypeFacets', document.getElementById('typeFacets')],
    ['author', 'authorFacets', document.getElementById('authorFacets')],
    ['tag', 'tagFacets', document.getElementById('tagFacets')],
    ['series', 'seriesFacets', document.getElementById('seriesFacets')],
    ['year', 'yearFacets', document.getElementById('yearFacets')],
  ];
  let any = false;
  for (const [kind, dataKey, row] of rows) {
    const facets = data[dataKey] || [];
    const [heading] = row.children;
    row.replaceChildren(heading);
    const expanded = expandedFacets.has(kind);
    const visible = expanded ? facets : facets.slice(0, FACET_LIMIT);
    for (const facet of visible) {
      row.appendChild(facetButton(facet.name, facet.count, kind));
    }
    if (facets.length > FACET_LIMIT) {
      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'chip chip--more';
      toggle.textContent = expanded ? 'Show fewer' : `Show all (${facets.length})`;
      toggle.setAttribute('aria-expanded', String(expanded));
      toggle.addEventListener('click', () => {
        if (expanded) expandedFacets.delete(kind); else expandedFacets.add(kind);
        if (lastFacets) renderFacets(lastFacets);
      });
      row.appendChild(toggle);
    }
    if (facets.length) any = true;
  }
  facetsEl.hidden = !any;
}

function resultNode(hit) {
  const item = document.createElement('li');
  item.className = 'result';

  const head = document.createElement('div');
  head.className = 'result__head';
  const badge = document.createElement('span');
  badge.className = 'badge';
  badge.textContent = hit.source || '';
  head.appendChild(badge);

  const link = safeHref(hit.appUrl || hit.originUrl);
  const title = document.createElement(link ? 'a' : 'span');
  title.className = 'result__title';
  title.textContent = hit.title || '';
  if (link) title.href = link;
  head.appendChild(title);
  item.appendChild(head);

  if (hit.snippet) {
    // The API escapes snippet text and only adds <em> around query terms, so
    // this is safe to insert as markup; no client-side re-escaping needed.
    const snippet = document.createElement('div');
    snippet.className = 'result__snippet';
    snippet.innerHTML = hit.snippet;
    item.appendChild(snippet);
  }

  const meta = [hit.contentType, hit.owner, hit.created ? fmtDate(hit.created) : '']
    .filter(Boolean)
    .join(' · ');
  if (meta) {
    const metaEl = document.createElement('div');
    metaEl.className = 'result__meta';
    metaEl.textContent = meta;
    item.appendChild(metaEl);
  }

  const details = metaPairs(hit.metadata).join(' · ');
  if (details) {
    const detailsEl = document.createElement('div');
    detailsEl.className = 'result__details';
    detailsEl.textContent = details;
    item.appendChild(detailsEl);
  }
  return item;
}

function renderResults() {
  resultsEl.replaceChildren(...state.hits.map(resultNode));
  if (state.hits.length === 0) {
    statusEl.textContent = 'No results';
  } else if (state.hasMore) {
    statusEl.textContent = `${state.hits.length} of ${state.total} results`;
  } else {
    statusEl.textContent = `${state.total} result${state.total === 1 ? '' : 's'}`;
  }
  moreWrap.hidden = !state.hasMore;
  loadMoreBtn.disabled = false;
  loadMoreBtn.textContent = 'Load more results';
  updateClearVisibility();
}

function resetResults() {
  state.hits = [];
  state.page = 0;
  state.total = 0;
  state.hasMore = false;
  resultsEl.replaceChildren();
  facetsEl.hidden = true;
  moreWrap.hidden = true;
  lastFacets = null;
  expandedFacets.clear();
  updateClearVisibility();
}

async function fetchPage(page) {
  const response = await fetch('/api/search?' + params(page).toString());
  if (response.status === 401) {
    location.href = '/';
    return null;
  }
  if (!response.ok) {
    let message = 'The search could not be completed. Try again.';
    try {
      const text = await response.text();
      if (text) message = text;
    } catch (err) {
      // Fall back to the generic message when the body cannot be read.
    }
    throw new Error(message);
  }
  return response.json();
}

function syncUrl() {
  const qs = params(0).toString();
  const url = qs ? `${location.pathname}?${qs}` : location.pathname;
  if (url !== location.pathname + location.search) {
    history.pushState(null, '', url);
  }
}

async function runSearch(event, { append = false, pushHistory = true } = {}) {
  if (event) event.preventDefault();
  const query = queryEl.value.trim();
  if (!query) {
    resetResults();
    statusEl.textContent = 'Enter a search term.';
    if (pushHistory) syncUrl();
    return;
  }
  if (!append) {
    resetResults();
    statusEl.textContent = 'Searching…';
    resultsEl.setAttribute('aria-busy', 'true');
  } else {
    loadMoreBtn.disabled = true;
    loadMoreBtn.textContent = 'Loading more…';
  }
  const page = append ? state.page + 1 : 0;
  let data;
  try {
    data = await fetchPage(page);
  } catch (err) {
    statusEl.textContent = err.message || 'The search could not be completed. Try again.';
    loadMoreBtn.disabled = false;
    loadMoreBtn.textContent = 'Load more results';
    return;
  } finally {
    resultsEl.removeAttribute('aria-busy');
  }
  if (!data) return;
  state.page = page;
  state.hits = state.hits.concat(data.hits || []);
  state.total = Math.max(state.total, data.total || 0);
  state.hasMore = Boolean(data.hasMore);
  if (!append) {
    fillSelect(ownerEl, facetNames(data.ownerFacets), 'All users');
    fillSelect(typeEl, facetNames(data.contentTypeFacets), 'All types');
    renderFacets(data);
  }
  renderResults();
  if (!append && pushHistory) syncUrl();
}

function clearFilters() {
  ownerEl.value = '';
  sourceEl.value = '';
  typeEl.value = '';
  afterEl.value = '';
  beforeEl.value = '';
  for (const key of Object.keys(chipFilters)) chipFilters[key] = '';
  runSearch();
}

async function loadSources() {
  try {
    const response = await fetch('/api/sources');
    if (response.status === 401) { location.href = '/'; return; }
    const data = await response.json();
    const sources = (data.sources || []).map((source) => ({
      value: source.id,
      label: source.displayName || source.id,
    }));
    fillSelect(sourceEl, sources, 'All sources');
    if (!queryEl.value.trim()) statusEl.textContent = '';
  } catch (err) {
    statusEl.textContent = 'Could not load the list of sources. Try refreshing the page.';
    statusEl.title = String(err);
  }
}

// Restores query and filters from the URL so a search is shareable and the
// back/forward buttons replay it. Returns whether a query was present.
function readUrlState() {
  const p = new URLSearchParams(location.search);
  queryEl.value = p.get('q') || '';
  chipFilters.kind = p.get('kind') || '';
  chipFilters.author = p.get('author') || '';
  chipFilters.tag = p.get('tag') || '';
  chipFilters.series = p.get('series') || '';
  chipFilters.year = p.get('year') || '';
  afterEl.value = p.get('after') || '';
  beforeEl.value = p.get('before') || '';
  sortEl.value = p.get('sort') === 'newest' ? 'newest' : 'relevance';
  setSelectValue(ownerEl, p.get('owner'));
  setSelectValue(typeEl, p.get('type'));
  setSelectValue(sourceEl, p.get('source'));
  updateClearVisibility();
  return Boolean(queryEl.value.trim());
}

function logout() {
  const target = window.SEARCH_LOGOUT_URL || '/';
  location.href = target;
}

document.getElementById('searchForm').addEventListener('submit', runSearch);
ownerEl.addEventListener('change', runSearch);
sourceEl.addEventListener('change', runSearch);
typeEl.addEventListener('change', runSearch);
sortEl.addEventListener('change', runSearch);
afterEl.addEventListener('change', runSearch);
beforeEl.addEventListener('change', runSearch);
clearBtn.addEventListener('click', clearFilters);
loadMoreBtn.addEventListener('click', () => runSearch(null, { append: true }));
window.addEventListener('popstate', () => {
  if (readUrlState()) {
    runSearch(null, { pushHistory: false });
  } else {
    resetResults();
    statusEl.textContent = '';
  }
});

const hadQuery = readUrlState();
loadSources();
if (hadQuery) runSearch(null, { pushHistory: false });
</script>
</body>
</html>
