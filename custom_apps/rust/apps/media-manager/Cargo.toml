[package]
name = "media-manager"
version.workspace = true
edition.workspace = true

[dependencies]
axum.workspace = true
homelab-common.workspace = true
chacha20poly1305.workspace = true
image.workspace = true
html2text.workspace = true
libc.workspace = true
lofty.workspace = true
rand.workspace = true
# reqwest 0.13 gates query-string encoding behind a feature (0.12 exposed it
# unconditionally); the provider lookups (TMDB, MusicBrainz, OpenSubtitles,
# Google Books) build requests with .query().
reqwest = { workspace = true, features = ["query"] }
roxmltree.workspace = true
rusqlite = { workspace = true, features = ["functions"] }
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal"] }
tokio-util.workspace = true
zip.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true
