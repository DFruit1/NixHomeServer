openapi: 3.1.0
info:
  title: Media Manager API
  version: 0.1.0
  description: >-
    Authenticated, root-ID-based media catalog and staged mutation API. All
    endpoints are served below /api/v1 and trust identity headers only from the
    loopback authentication gateway.
servers:
  - url: /api/v1
security:
  - forwardedIdentity: []
paths:
  /status:
    get:
      operationId: getStatus
      responses:
        "200":
          description: Runtime health and registered integration availability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Authenticated identity and permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Error"
  /provider-accounts:
    get:
      operationId: listProviderAccounts
      description: >-
        Lists the provider catalog and only the caller's non-secret account
        state. Saved credential values are never returned.
      responses:
        "200":
          description: Public, configurable, active, and planned provider sources.
          headers:
            Cache-Control:
              schema: { type: string, const: "no-store, max-age=0" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderCatalogResponse"
        "401":
          $ref: "#/components/responses/Error"
  /provider-accounts/{providerId}:
    parameters:
      - in: path
        name: providerId
        required: true
        schema: { type: string, pattern: "^[a-z0-9-]{1,64}$" }
    put:
      operationId: saveProviderAccount
      description: >-
        Replaces the caller's complete credential document. The submitted
        values are encrypted by the provider broker and are not echoed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProviderAccountRequest"
      responses:
        "200":
          description: Non-secret provider setup state after replacement.
          content:
            application/json:
              schema:
                type: object
                required: [provider, requestId]
                properties:
                  provider: { $ref: "#/components/schemas/ProviderDefinition" }
                  requestId: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProviderAccount
      description: Idempotently removes only the caller's account for this provider.
      responses:
        "204": { description: Account absent after the request. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /provider-accounts/{providerId}/test:
    post:
      operationId: testProviderAccount
      description: >-
        Performs a bounded live provider request using the caller's encrypted
        account and stores only a normalized result. Credential values and
        provider response bodies are never returned or logged.
      parameters:
        - in: path
          name: providerId
          required: true
          schema: { type: string, pattern: "^[a-z0-9-]{1,64}$" }
      responses:
        "200":
          description: Normalized live connection result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderTestResult"
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /provider-lookups/tmdb/search:
    post:
      operationId: searchTmdbWithRuntimeAccount
      description: Searches TMDB using only the authenticated caller's encrypted runtime account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: { type: string, minLength: 1, maxLength: 500 }
                year: { type: integer, minimum: 1801, maximum: 2100 }
                mediaType: { type: string, enum: [movie, tv, auto], default: auto }
      responses:
        "200": { description: Ranked, non-writing movie and television candidates. }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /provider-lookups/tmdb/details:
    post:
      operationId: getTmdbDetailsWithRuntimeAccount
      description: Fetches a normalized candidate for filling a reviewable metadata draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tmdbId, mediaType]
              properties:
                tmdbId: { type: integer, minimum: 1 }
                mediaType: { type: string, enum: [movie, tv, season, episode] }
                seasonNumber:
                  type: integer
                  minimum: 0
                  description: Required for season and episode details.
                episodeNumber:
                  type: integer
                  minimum: 1
                  description: Required for episode details.
      responses:
        "200": { description: Normalized details with provider and external IDs. }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /provider-lookups/tmdb/images/{size}/{fileName}:
    get:
      operationId: getTmdbImage
      description: Proxies one validated TMDB image path through a 32 MiB, content-sniffed boundary.
      parameters:
        - in: path
          name: size
          required: true
          schema: { type: string, enum: [w342, w500, w780, original] }
        - in: path
          name: fileName
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]+\\.(jpg|jpeg|png|webp)$" }
      responses:
        "200": { description: Bounded raster artwork bytes. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /provider-lookups/cover-art-archive/releases/{releaseId}/front:
    get:
      operationId: getCoverArtArchiveFront
      description: Proxies a release-specific front cover and follows only allowlisted archive redirects.
      parameters:
        - in: path
          name: releaseId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Bounded, content-sniffed front artwork bytes. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /provider-lookups/google-books/search:
    post:
      operationId: searchGoogleBooks
      description: Searches Google Books with the caller's runtime key and returns normalized volumes without exposing image URLs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Bounded normalized volume candidates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoogleBooksSearchResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /provider-lookups/google-books/volumes/{volumeId}/cover:
    get:
      operationId: getGoogleBooksCover
      description: Resolves a validated volume ID and proxies only an allowlisted Google-hosted cover.
      parameters:
        - in: path
          name: volumeId
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
      responses:
        "200": { description: Bounded, content-sniffed cover bytes. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /provider-lookups/open-library/search:
    post:
      operationId: searchOpenLibrary
      description: >-
        Searches public Open Library work and edition records and returns a
        bounded normalized candidate set for review; this endpoint never writes
        metadata and does not require a provider account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: A title, author, ISBN-10, or ISBN-13.
      responses:
        "200":
          description: Relevance-ordered, normalized book candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenLibrarySearchResponse"
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /provider-lookups/open-library/works/{workId}/editions:
    get:
      operationId: listOpenLibraryEditions
      description: >-
        Lists one bounded page of normalized editions for a validated Open
        Library work ID. Requests are authenticated, human-triggered, and
        share the adapter's rate gate.
      parameters:
        - in: path
          name: workId
          required: true
          schema: { type: string, pattern: "^OL[0-9]{1,16}W$" }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 12 }
      responses:
        "200":
          description: A bounded page of normalized edition candidates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenLibraryEditionsResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /provider-lookups/open-library/covers/{coverId}:
    get:
      operationId: getOpenLibraryCover
      description: >-
        Proxies one Open Library cover selected by its positive numeric cover
        ID. The response is limited to supported raster types and 16 MiB,
        marked nosniff, and is never used as an arbitrary URL fetcher.
      parameters:
        - in: path
          name: coverId
          required: true
          schema: { type: integer, minimum: 1, maximum: 9223372036854775807 }
      responses:
        "200":
          description: Bounded cover image bytes.
          headers:
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            image/jpeg: {}
            image/png: {}
            image/gif: {}
            image/webp: {}
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /provider-lookups/opensubtitles/search:
    post:
      operationId: searchOpenSubtitlesWithRuntimeAccount
      description: Uses the caller's runtime account and a locally calculated movie hash; media contents are not sent to the provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query, languages]
              properties:
                movieHash: { type: string, pattern: "^[0-9a-fA-F]{16}$" }
                movieByteSize: { type: integer, minimum: 131072 }
                query: { type: string, minLength: 1, maxLength: 200 }
                languages: { type: string }
      responses:
        "200": { description: Exact hash matches or title-fallback candidates. }
        "401": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /provider-lookups/opensubtitles/download:
    post:
      operationId: downloadOpenSubtitlesWithRuntimeAccount
      description: Allocates and streams one bounded SRT using the caller's account; no provider token is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fileId]
              properties:
                fileId: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Bounded SRT bytes.
          content:
            application/x-subrip:
              schema: { type: string, format: binary, maxLength: 10485760 }
        "401": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /provider-lookups/acoustid/lookup:
    post:
      operationId: lookupAcoustidWithRuntimeAccount
      description: Resolves a locally calculated Chromaprint fingerprint using the caller's AcoustID key; audio contents are never uploaded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fingerprint, duration]
              properties:
                fingerprint: { type: string, minLength: 4, maxLength: 16384 }
                duration: { type: integer, minimum: 1, maximum: 86400 }
      responses:
        "200": { description: Deduplicated MusicBrainz release-group IDs. }
        "401": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /roots:
    get:
      operationId: listRoots
      responses:
        "200":
          description: Server-defined roots visible to the caller.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Root"
  /items:
    get:
      operationId: listItems
      parameters:
        - in: query
          name: rootId
          required: true
          schema:
            type: string
        - in: query
          name: cursor
          schema:
            type: string
      responses:
        "200":
          description: Catalog items scoped to one visible root.
        "403":
          $ref: "#/components/responses/Error"
  /items/{itemId}:
    get:
      operationId: getCatalogItem
      description: >-
        Returns one catalog record visible to the caller. This resource lets a
        durable item URL restore records beyond the bounded library list.
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: One visible catalog record.
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /conversions:
    get:
      operationId: listConversions
      responses:
        "200":
          description: MKVMaker progress, or an unavailable state.
  /conversions/inbox:
    get:
      operationId: listConversionInbox
      description: >-
        Lists the shared DVD ISO inbox without exposing it as a catalog root:
        waiting ISOs beside the _Processed and _Failed results. Each entry
        carries the parsed ISO 9660 volume label when present so discs can be
        identified beyond their file names.
      responses:
        "200":
          description: Inbox availability and the pending, processed, and failed ISO groups.
          content:
            application/json:
              schema:
                type: object
                required: [available, pending, processed, failed]
                properties:
                  available: { type: boolean }
                  pending:
                    type: array
                    items: { $ref: "#/components/schemas/InboxIso" }
                  processed:
                    type: array
                    items: { $ref: "#/components/schemas/InboxIso" }
                  failed:
                    type: array
                    items: { $ref: "#/components/schemas/InboxIso" }
        "401":
          $ref: "#/components/responses/Error"
  /items/{itemId}/image:
    get:
      operationId: getItemImage
      description: >-
        Streams cover artwork for one visible catalog item. Artwork items are
        served directly. For media items the server prefers title-specific and
        well-known cover files beside the item, then searches nearby parent
        folders used by media servers, and finally reads embedded tag artwork
        from supported containers. Reads use the same symlink-safe contained
        open as the broker.
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The selected artwork bytes.
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
            image/gif: {}
            image/bmp: {}
            image/tiff: {}
            image/avif: {}
            image/svg+xml: {}
            image/heic: {}
            image/heif: {}
            image/jxl: {}
        "404":
          $ref: "#/components/responses/Error"
  /items/{itemId}/image/replacement:
    post:
      operationId: previewArtworkReplacement
      description: >-
        Authenticates the caller before reading the body, fully decodes the
        bounded image, and privately stages cover artwork for a visible media
        or artwork item. When a same-folder cover exists, confirmation archives
        it in a superseded subfolder and installs the replacement. Otherwise it
        installs a new cover beside the media. Both operations are
        fingerprint-bound and refuse to overwrite a destination. Requires an
        editor.
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
        - in: query
          name: format
          required: true
          schema: { type: string, enum: [jpg, jpeg, png, gif, webp] }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary, maxLength: 33554432 }
          image/png:
            schema: { type: string, format: binary, maxLength: 33554432 }
          image/gif:
            schema: { type: string, format: binary, maxLength: 33554432 }
          image/webp:
            schema: { type: string, format: binary, maxLength: 33554432 }
      responses:
        "201":
          description: Digest-bound no-overwrite install or archive-and-replace mutation preview.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
  /items/{itemId}/subtitles:
    get:
      operationId: getInstalledSubtitles
      description: Lists bounded external sidecars and probed embedded subtitle streams, including language, codec, and disposition flags.
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Installed subtitle inventory and the native Jellyfin management capability.
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /items/{itemId}/subtitles/installed/{subtitleId}/content:
    get:
      operationId: previewInstalledSubtitle
      description: Parses the first 40 cues from one contained UTF-8 SRT, WebVTT, or ASS sidecar and reports timing, overlap, and reading-speed issues.
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
        - in: path
          name: subtitleId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Parsed cue preview and validation report. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /items/{itemId}/subtitles/search:
    get:
      operationId: searchOpenSubtitles
      description: >-
        Searches the configured OpenSubtitles provider for one visible video.
        The server computes an OpenSubtitles movie hash from a contained local
        file read, returns exact hash matches when available, and otherwise
        falls back to the supplied or derived title. Requires an editor.
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
        - in: query
          name: languages
          required: true
          schema: { type: string, example: en, fr }
        - in: query
          name: query
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: >-
            Downloadable subtitle file matches, release details, hash-match
            flags, and the movie-hash or title-fallback matching method.
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /items/{itemId}/subtitles/provider:
    post:
      operationId: previewOpenSubtitlesInstall
      description: Downloads a selected OpenSubtitles file into private staging and creates a no-overwrite sidecar preview.
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileId, language]
              additionalProperties: false
              properties:
                fileId: { type: integer, minimum: 1 }
                language: { type: string }
                hearingImpaired: { type: boolean, default: false }
      responses:
        "201":
          description: Digest-bound subtitle install preview.
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /items/{itemId}/subtitles/upload:
    post:
      operationId: previewUploadedSubtitleInstall
      description: Validates and privately stages one UTF-8 SRT, WebVTT, or ASS file, then creates a no-overwrite sidecar preview.
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
        - in: query
          name: language
          required: true
          schema: { type: string }
        - in: query
          name: format
          schema: { type: string, enum: [srt, vtt, ass] }
        - in: query
          name: hearingImpaired
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/x-subrip:
            schema: { type: string, format: binary, maxLength: 10485760 }
          text/vtt:
            schema: { type: string, format: binary, maxLength: 10485760 }
          application/x-ass:
            schema: { type: string, format: binary, maxLength: 10485760 }
      responses:
        "201":
          description: Digest-bound subtitle install preview.
        "403":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
  /items/{itemId}/metadata:
    get:
      operationId: getItemMetadata
      description: Returns filename, sidecar, embedded EPUB/ComicInfo/PDF/audio-tag, Jellyfin, Audiobookshelf, and Kavita observations with per-field provenance, persistence, health, and modification targets. App data comes from fresh bounded API snapshots rather than direct app database reads.
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Effective descriptive metadata, independent source observations, compatibility effects, and bounded stream facts.
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemMetadata" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /metadata/issues:
    get:
      operationId: listMetadataIssues
      description: >-
        Reconciles the selected visible root on the first page, inspects a
        bounded page of catalog records, and returns only records with
        actionable metadata health issues. Pass nextCursor unchanged to inspect
        the next catalog page without repeating the reconciliation scan.
      parameters:
        - in: query
          name: rootId
          required: true
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 4096 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One bounded page of grouped metadata health results.
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataIssuesPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /folders/metadata:
    get:
      operationId: getFolderMetadata
      description: >-
        Returns filename-derived editable metadata for one contained directory
        in a visible media root. The directory is opened beneath the
        server-defined root before any metadata is returned.
      parameters:
        - in: query
          name: rootId
          required: true
          schema: { type: string }
        - in: query
          name: relativePath
          required: true
          schema: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        "200":
          description: Folder-derived metadata for a media directory or a selectable collection/grouping directory.
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemMetadata" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /items/{itemId}/metadata/sidecar:
    post:
      operationId: previewMetadataSidecar
      description: Creates a no-overwrite NFO/OPF install preview, a recoverable XML-preserving sidecar replacement, or a validated recoverable embedded EPUB/CBZ metadata rewrite. PDF, CBR, and podcast tag writes remain inspection-only.
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              additionalProperties: false
              properties:
                mediaType:
                  description: Optional for backward compatibility; when omitted it is derived from the catalog kind (video defaults to movie).
                  type: string
                  enum: [movie, series, season, episode, music, audiobook, book]
                title: { type: string, minLength: 1, maxLength: 500 }
                sortTitle: { type: string, maxLength: 500 }
                year:
                  description: Must be omitted when the release year is unknown.
                  type: integer
                  minimum: 1
                  maximum: 2100
                description: { type: string, maxLength: 20000 }
                publisher: { type: string, maxLength: 500 }
                series: { type: string, maxLength: 500 }
                volumeNumber: { type: string, maxLength: 32 }
                isbn: { type: string, maxLength: 64 }
                language: { type: string, maxLength: 15 }
                authors:
                  {
                    type: array,
                    maxItems: 32,
                    items: { type: string, maxLength: 500 },
                  }
                narrators:
                  {
                    type: array,
                    maxItems: 32,
                    items: { type: string, maxLength: 500 },
                  }
                genres:
                  {
                    type: array,
                    maxItems: 64,
                    items: { type: string, maxLength: 500 },
                  }
                season: { type: integer, minimum: 0, maximum: 10000 }
                episode: { type: integer, minimum: 1, maximum: 100000 }
                episodeTitle: { type: string, maxLength: 500 }
                premiereDate: { type: string, format: date }
                runtimeMinutes: { type: integer, minimum: 1, maximum: 100000 }
                officialRating: { type: string, maxLength: 64 }
                communityRating: { type: number, minimum: 0, maximum: 10 }
                writers:
                  {
                    type: array,
                    maxItems: 64,
                    items: { type: string, maxLength: 500 },
                  }
                providerIds:
                  type: object
                  maxProperties: 32
                  additionalProperties: { type: string, maxLength: 256 }
      responses:
        "201":
          description: Digest-bound no-overwrite metadata sidecar preview.
        "403":
          $ref: "#/components/responses/Error"
  /folders/metadata/sidecar:
    post:
      operationId: previewFolderMetadataSidecar
      description: >-
        Creates a staged Jellyfin folder NFO or book/audiobook OPF sidecar for
        one contained directory in a visible media root. The inferred folder
        media type cannot be overridden. Requires an editor.
      parameters:
        - in: query
          name: rootId
          required: true
          schema: { type: string }
        - in: query
          name: relativePath
          required: true
          schema: { type: string, minLength: 1, maxLength: 4096 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              additionalProperties: false
              properties:
                mediaType:
                  type: string
                  enum: [movie, series, season, music, audiobook, book]
                title: { type: string, minLength: 1, maxLength: 500 }
                sortTitle: { type: string, maxLength: 500 }
                year: { type: integer, minimum: 1, maximum: 2100 }
                description: { type: string, maxLength: 20000 }
                publisher: { type: string, maxLength: 500 }
                series: { type: string, maxLength: 500 }
                volumeNumber: { type: string, maxLength: 32 }
                isbn: { type: string, maxLength: 64 }
                language: { type: string, maxLength: 15 }
                authors:
                  {
                    type: array,
                    maxItems: 32,
                    items: { type: string, maxLength: 500 },
                  }
                narrators:
                  {
                    type: array,
                    maxItems: 32,
                    items: { type: string, maxLength: 500 },
                  }
                genres:
                  {
                    type: array,
                    maxItems: 64,
                    items: { type: string, maxLength: 500 },
                  }
                premiereDate: { type: string, format: date }
                runtimeMinutes: { type: integer, minimum: 1, maximum: 100000 }
                officialRating: { type: string, maxLength: 64 }
                communityRating: { type: number, minimum: 0, maximum: 10 }
                writers:
                  {
                    type: array,
                    maxItems: 64,
                    items: { type: string, maxLength: 500 },
                  }
                providerIds:
                  type: object
                  maxProperties: 32
                  additionalProperties: { type: string, maxLength: 256 }
      responses:
        "201":
          description: Digest-bound no-overwrite folder sidecar preview.
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /items/{itemId}/metadata/lookup:
    post:
      operationId: lookupMusicMetadata
      description: >-
        MusicBrainz Picard-style metadata lookup for a cataloged music file.
        In fingerprint mode the audio is fingerprinted with fpcalc and resolved
        through AcoustID; in search mode the artist and title query MusicBrainz
        directly; in auto mode fingerprint is tried first and search is the
        fallback. Returns exact release candidates when MusicBrainz exposes a
        release ID, with release-group fallback candidates otherwise.
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                mode:
                  description: Defaults to auto when omitted.
                  type: string
                  enum: [auto, fingerprint, search]
                artist: { type: string, maxLength: 500 }
                title: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Exact-release or release-group fallback candidates and a request identifier for tracing.
          content:
            application/json:
              schema:
                type: object
                required: [candidates, requestId]
                additionalProperties: false
                properties:
                  candidates:
                    type: array
                    items:
                      { $ref: "#/components/schemas/MusicReleaseCandidate" }
                  requestId: { type: string }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /integrations/{integrationId}/refresh:
    get:
      operationId: getIntegrationRefresh
      description: >-
        Returns the latest durable refresh state for one available,
        server-registered adapter. Queued and running requests retain their
        request ID so the browser can follow them through completion.
      parameters:
        - in: path
          name: integrationId
          required: true
          schema:
            type: string
            enum: [jellyfin, audiobookshelf, kavita, syncthing]
      responses:
        "200":
          description: Latest refresh state, or idle when none has run yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationRefresh"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    post:
      operationId: queueIntegrationRefresh
      description: >-
        Queues a request for one available, server-registered refresh adapter.
        The integration identifier is checked against a closed allowlist and
        the request is dispatched out of process. Any authenticated user may
        request this closed, coalescing operation.
      parameters:
        - in: path
          name: integrationId
          required: true
          schema:
            type: string
            enum: [jellyfin, audiobookshelf, kavita, syncthing]
      responses:
        "202":
          description: Refresh queued, or already waiting for dispatch.
          content:
            application/json:
              schema:
                type: object
                required: [integrationId, state, alreadyQueued, requestId]
                additionalProperties: false
                properties:
                  integrationId: { type: string }
                  state: { type: string, const: queued }
                  alreadyQueued: { type: boolean }
                  requestId: { type: string }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /scans:
    post:
      operationId: scanRoot
      description: Reconciles one visible, server-defined root. Requires an editor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rootId]
              additionalProperties: false
              properties:
                rootId: { type: string }
      responses:
        "200":
          description: Synchronous scan summary.
        "403":
          $ref: "#/components/responses/Error"
  /plans:
    post:
      operationId: previewMutationPlan
      description: >-
        Creates an immutable preview. Requires media-manager-editors. The body
        contains root IDs, item IDs, and a closed operation union; never paths.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "201":
          description: Previewed plan including its digest and warnings.
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /plans/{planId}/confirm:
    post:
      operationId: confirmMutationPlan
      description: Confirms exactly the preview identified by the plan digest.
      parameters:
        - in: path
          name: planId
          required: true
          schema:
            type: string
        - in: header
          name: If-Match
          required: true
          description: Quoted SHA-256 digest returned by the preview endpoint.
          schema:
            type: string
      responses:
        "202":
          description: Mutation job durably queued.
        "409":
          $ref: "#/components/responses/Error"
        "412":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /plans/{planId}:
    get:
      operationId: getMutationPlanStatus
      description: Returns the durable state of one mutation plan owned by the authenticated identity so clients can wait before refreshing a consuming media app.
      parameters:
        - in: path
          name: planId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current previewed, queued, running, completed, failed, expired, or rejected state.
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    forwardedIdentity:
      type: apiKey
      in: header
      name: X-Forwarded-User
      description: Injected only by the shared loopback authentication gateway.
  responses:
    Error:
      description: Stable structured error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Status:
      type: object
      required: [schemaVersion, service, mutationMode, integrations]
      properties:
        schemaVersion: { type: integer, const: 1 }
        service: { type: string, const: media-manager }
        mutationMode: { type: string, enum: [read-only, enabled] }
        integrations:
          type: array
          items:
            type: object
            required: [id, available]
            properties:
              id: { type: string }
              available: { type: boolean }
    Session:
      type: object
      required: [username, groups, canEdit]
      properties:
        username: { type: string }
        groups: { type: array, items: { type: string } }
        canEdit: { type: boolean }
    ProviderCatalogResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, providers, recoveryAdvice, requestId]
      properties:
        schemaVersion: { type: integer, const: 1 }
        providers:
          type: array
          items: { $ref: "#/components/schemas/ProviderDefinition" }
        recoveryAdvice: { type: string }
        requestId: { type: string }
    ProviderDefinition:
      type: object
      additionalProperties: false
      required:
        [id, name, mediaDomains, setupKind, implementationStatus, canConfigure, canTest, capabilities,
         credentialFields, setupUrl, documentationUrl, notes, account]
      properties:
        id: { type: string }
        name: { type: string }
        mediaDomains: { type: array, items: { type: string } }
        setupKind: { type: string, enum: [public, apiKey, account] }
        implementationStatus: { type: string, enum: [active, planned] }
        canConfigure:
          type: boolean
          description: Whether this deployed adapter accepts runtime credentials.
        canTest:
          type: boolean
          description: Whether a configured account supports a live connection test.
        capabilities: { type: array, items: { type: string } }
        credentialFields:
          type: array
          items: { $ref: "#/components/schemas/ProviderCredentialField" }
        setupUrl: { type: string, format: uri }
        documentationUrl: { type: string, format: uri }
        notes: { type: string }
        account: { $ref: "#/components/schemas/ProviderAccountState" }
    ProviderCredentialField:
      type: object
      additionalProperties: false
      required: [id, label, inputType, isRequired, help]
      properties:
        id: { type: string }
        label: { type: string }
        inputType: { type: string, enum: [password, text] }
        isRequired: { type: boolean }
        help: { type: string }
    ProviderAccountState:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [notRequired, notConfigured, configured] }
        configuredAt: { type: integer }
        updatedAt: { type: integer }
        lastTestedAt: { type: integer, nullable: true }
        lastTestStatus:
          type: string
          nullable: true
          enum: [ready, rejected, rateLimited, unavailable, null]
        lastTestMessage: { type: string, nullable: true }
    SaveProviderAccountRequest:
      type: object
      additionalProperties: false
      required: [credentials]
      properties:
        credentials:
          type: object
          minProperties: 1
          maxProperties: 8
          additionalProperties: { type: string, maxLength: 8192 }
          description: >-
            Complete provider-specific credential document. Values are
            write-only and never appear in any response.
    ProviderTestResult:
      type: object
      additionalProperties: false
      required: [providerId, status, message, requestId]
      properties:
        providerId: { type: string }
        status:
          type: string
          enum: [ready, rejected, rateLimited, unavailable]
        message: { type: string }
        requestId: { type: string }
    OpenLibrarySearchResponse:
      type: object
      additionalProperties: false
      required: [provider, query, results, requestId]
      properties:
        provider: { type: string, const: open-library }
        query: { type: string }
        results:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/OpenLibraryCandidate" }
        requestId: { type: string }
    OpenLibraryCandidate:
      type: object
      additionalProperties: false
      required:
        [workId, title, authors, publishers, languages, subjects]
      properties:
        workId: { type: string, pattern: "^OL[0-9]{1,16}W$" }
        editionId: { type: string, pattern: "^OL[0-9]{1,16}M$" }
        title: { type: string, maxLength: 500 }
        editionTitle: { type: string, maxLength: 500 }
        authors:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 250 }
        firstPublishYear: { type: integer, minimum: 1000, maximum: 2100 }
        editionCount: { type: integer, minimum: 1 }
        publishDate: { type: string, maxLength: 100 }
        publishYear: { type: integer, minimum: 1000, maximum: 2100 }
        publishers:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 250 }
        isbn10: { type: string, pattern: "^[0-9]{9}[0-9X]$" }
        isbn13: { type: string, pattern: "^[0-9]{13}$" }
        languages:
          type: array
          maxItems: 12
          items: { type: string, pattern: "^[A-Za-z-]{1,16}$" }
        subjects:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 250 }
        numberOfPages: { type: integer, minimum: 1, maximum: 100000 }
        coverId: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        coverUrl: { type: string, format: uri }
    OpenLibraryEditionsResponse:
      type: object
      additionalProperties: false
      required:
        [provider, workId, offset, limit, total, hasMore, results, requestId]
      properties:
        provider: { type: string, const: open-library }
        workId: { type: string, pattern: "^OL[0-9]{1,16}W$" }
        offset: { type: integer, minimum: 0, maximum: 10000 }
        limit: { type: integer, minimum: 1, maximum: 20 }
        total: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
        results:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/OpenLibraryEdition" }
        requestId: { type: string }
    OpenLibraryEdition:
      type: object
      additionalProperties: false
      required: [editionId, title, publishers, languages]
      properties:
        editionId: { type: string, pattern: "^OL[0-9]{1,16}M$" }
        title: { type: string, maxLength: 500 }
        publishDate: { type: string, maxLength: 100 }
        publishYear: { type: integer, minimum: 1000, maximum: 2100 }
        publishers:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 250 }
        isbn10: { type: string, pattern: "^[0-9]{9}[0-9X]$" }
        isbn13: { type: string, pattern: "^[0-9]{13}$" }
        languages:
          type: array
          maxItems: 12
          items: { type: string, pattern: "^[A-Za-z-]{1,16}$" }
        numberOfPages: { type: integer, minimum: 1, maximum: 100000 }
        coverId: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        coverUrl: { type: string, format: uri }
    Root:
      type: object
      required: [id, label, category, scope]
      properties:
        id: { type: string }
        label: { type: string }
        category: { type: string }
        scope: { type: string, enum: [shared, personal] }
    CatalogItem:
      type: object
      required:
        [id, rootId, relativePath, mediaKind, sizeBytes, modifiedNs, fingerprint]
      properties:
        id: { type: string }
        rootId: { type: string }
        ownerUsername: { type: string, nullable: true }
        relativePath: { type: string }
        mediaKind: { type: string }
        sizeBytes: { type: integer, minimum: 0 }
        modifiedNs: { type: integer, minimum: 0 }
        fingerprint: { type: string }
    InboxIso:
      type: object
      required: [name, sizeBytes, modifiedNs]
      properties:
        name: { type: string }
        volumeId:
          type: string
          nullable: true
          description: ISO 9660 primary volume label, when the disc provides one.
        sizeBytes: { type: integer, minimum: 0 }
        modifiedNs: { type: integer, minimum: 0 }
    IntegrationRefresh:
      type: object
      required: [integrationId, state]
      additionalProperties: false
      properties:
        integrationId: { type: string }
        state:
          type: string
          enum: [idle, queued, running, succeeded, failed]
        requestId: { type: string }
        queuedAt: { type: integer }
        startedAt: { type: integer }
        finishedAt: { type: integer }
        message: { type: string }
    ItemMetadata:
      type: object
      required:
        [
          mediaType,
          title,
          genres,
          writers,
          providerIds,
          videoStreams,
          audioStreams,
          subtitleStreams,
          sources,
          observations,
          fieldSources,
          sidecar,
          consumers,
          health,
          modificationTargets,
          inspectionWarnings,
        ]
      properties:
        mediaType:
          {
            type: string,
            enum:
              [
                collection,
                movie,
                series,
                season,
                episode,
                music,
                audiobook,
                podcast,
                book,
              ],
          }
        title: { type: string }
        year: { type: integer, nullable: true }
        series: { type: string, nullable: true }
        season: { type: integer, nullable: true }
        episode: { type: integer, nullable: true }
        episodeTitle: { type: string, nullable: true }
        description: { type: string, nullable: true }
        publisher: { type: string, nullable: true }
        language: { type: string, nullable: true }
        genres: { type: array, items: { type: string } }
        writers: { type: array, items: { type: string } }
        premiereDate: { type: string, nullable: true }
        runtimeMinutes: { type: integer, nullable: true }
        officialRating: { type: string, nullable: true }
        communityRating: { type: number, nullable: true }
        providerIds: { type: object, additionalProperties: { type: string } }
        videoStreams: { type: array, items: { type: object } }
        audioStreams: { type: array, items: { type: object } }
        subtitleStreams: { type: array, items: { type: object } }
        sources:
          {
            type: array,
            items:
              {
                type: string,
                enum:
                  [
                    filename,
                    folder,
                    jellyfin,
                    audiobookshelf,
                    kavita,
                    sidecar,
                    embedded-epub,
                    embedded-comicinfo,
                    embedded-pdf-xmp,
                    embedded-audio-tags,
                  ],
              },
          }
        observations:
          type: array
          items: { $ref: "#/components/schemas/MetadataObservation" }
        fieldSources:
          type: object
          additionalProperties: { type: string }
        sidecar: { $ref: "#/components/schemas/MetadataSidecarInspection" }
        consumers:
          type: array
          items: { $ref: "#/components/schemas/MetadataConsumer" }
        health:
          type: array
          items: { $ref: "#/components/schemas/MetadataHealthIssue" }
        modificationTargets:
          type: array
          items: { $ref: "#/components/schemas/MetadataModificationTarget" }
        inspectionWarnings:
          type: array
          items: { type: string }
    MetadataObservation:
      type: object
      required: [source, label, storage, consumedBy, survivesRescan, writable, fields]
      properties:
        source: { type: string }
        label: { type: string }
        observedAt: { type: integer }
        relativePath: { type: string }
        format: { type: string, enum: [nfo, opf, comicinfo, xmp, id3v2, mp4ilst, ape, vorbiscomments] }
        appItemId: { type: string }
        storage: { type: string, enum: [filename, folder-name, sidecar-file, embedded-file, application-database] }
        consumedBy: { type: array, items: { type: string, enum: [jellyfin, audiobookshelf, kavita] } }
        survivesRescan: { type: boolean }
        writable: { type: boolean }
        locked: { type: boolean }
        fields: { type: object }
        rawPreview: { type: string, maxLength: 65540 }
    MetadataSidecarInspection:
      type: object
      required: [relativePath, format, exists, canReplace, consumerEffective]
      properties:
        relativePath: { type: string }
        format: { type: string, enum: [nfo, opf] }
        exists: { type: boolean }
        canReplace: { type: boolean }
        consumerEffective: { type: boolean }
    MetadataConsumer:
      type: object
      required: [id, label, available, effect, canManageNatively, portableWriteSupported, message]
      properties:
        id: { type: string, enum: [jellyfin, audiobookshelf, kavita] }
        label: { type: string }
        available: { type: boolean }
        effect: { type: string, enum: [read-after-refresh, embedded-metadata-required, native-podcast-metadata] }
        canManageNatively: { type: boolean }
        portableWriteSupported: { type: boolean }
        message: { type: string }
        nativeUrl: { type: string, format: uri }
    MetadataHealthIssue:
      type: object
      required: [code, severity, title, message, sources]
      properties:
        code: { type: string }
        severity: { type: string, enum: [info, warning, error] }
        field: { type: string }
        title: { type: string }
        message: { type: string }
        sources: { type: array, items: { type: string } }
    MetadataHealthResult:
      type: object
      required: [itemId, rootId, relativePath, mediaKind, health]
      properties:
        itemId: { type: string }
        rootId: { type: string }
        relativePath: { type: string }
        mediaKind: { type: string, enum: [video, music, audiobook, podcast, book] }
        health:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/MetadataHealthIssue" }
    MetadataIssueSeverityCounts:
      type: object
      required: [error, warning, info]
      properties:
        error: { type: integer, minimum: 0 }
        warning: { type: integer, minimum: 0 }
        info: { type: integer, minimum: 0 }
    MetadataIssuesPage:
      type: object
      required:
        [rootId, results, inspectedItems, issueCount, severityCounts, nextCursor]
      properties:
        rootId: { type: string }
        results:
          type: array
          items: { $ref: "#/components/schemas/MetadataHealthResult" }
        inspectedItems: { type: integer, minimum: 0, maximum: 50 }
        issueCount: { type: integer, minimum: 0 }
        severityCounts:
          { $ref: "#/components/schemas/MetadataIssueSeverityCounts" }
        nextCursor: { type: string, nullable: true, maxLength: 4096 }
    MetadataModificationTarget:
      type: object
      required: [id, label, kind, available, recommended, requiresRefresh, message]
      properties:
        id: { type: string }
        label: { type: string }
        kind: { type: string, enum: [portable-file, application-local] }
        available: { type: boolean }
        recommended: { type: boolean }
        requiresRefresh: { type: boolean }
        message: { type: string }
    MusicReleaseCandidate:
      type: object
      required: [releaseGroupId, artist, title, genres, matchMethod]
      additionalProperties: false
      properties:
        releaseGroupId: { type: string, format: uuid }
        releaseId: { type: string, format: uuid, nullable: true }
        artist: { type: string }
        title: { type: string }
        releaseType:
          type: string
          nullable: true
          description: MusicBrainz primary release type such as album or single.
        year: { type: integer, nullable: true }
        releaseDate: { type: string, nullable: true }
        releaseStatus: { type: string, nullable: true }
        country: { type: string, nullable: true }
        barcode: { type: string, nullable: true }
        catalogNumber: { type: string, nullable: true }
        packaging: { type: string, nullable: true }
        disambiguation: { type: string, nullable: true }
        genres:
          type: array
          items: { type: string }
        label: { type: string, nullable: true }
        trackCount: { type: integer, nullable: true }
        matchMethod:
          description: How the candidate was resolved.
          type: string
          enum: [fingerprint, search]
    GoogleBooksSearchResponse:
      type: object
      required: [provider, query, totalItems, results, requestId]
      properties:
        provider: { type: string, const: google-books }
        query: { type: string }
        totalItems: { type: integer, minimum: 0 }
        results:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/GoogleBooksCandidate" }
        requestId: { type: string }
    GoogleBooksCandidate:
      type: object
      required: [volumeId, title, authors, industryIdentifiers, categories, coverAvailable]
      properties:
        volumeId: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
        title: { type: string }
        subtitle: { type: string, nullable: true }
        authors: { type: array, items: { type: string } }
        publisher: { type: string, nullable: true }
        publishedDate: { type: string, nullable: true }
        year: { type: integer, nullable: true }
        description: { type: string, nullable: true }
        isbn: { type: string, nullable: true }
        industryIdentifiers: { type: array, items: { type: object } }
        pageCount: { type: integer, nullable: true }
        categories: { type: array, items: { type: string } }
        language: { type: string, nullable: true }
        averageRating: { type: number, nullable: true }
        ratingsCount: { type: integer, nullable: true }
        coverAvailable: { type: boolean }
    PlanRequest:
      type: object
      required: [operation, itemIds]
      additionalProperties: false
      properties:
        operation:
          oneOf:
            - $ref: "#/components/schemas/CanonicalizeNames"
            - $ref: "#/components/schemas/SemanticMove"
            - $ref: "#/components/schemas/Tombstone"
        itemIds:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string }
    CanonicalizeNames:
      type: object
      required: [kind, profile, title]
      additionalProperties: false
      properties:
        kind: { const: canonicalize_names }
        profile:
          type: string
          enum: [movie, tv, music, audiobook, book, filename]
        organizeFolders:
          type: boolean
          default: true
        title: { type: string, minLength: 1, maxLength: 200 }
        year:
          description: Omit when the actual release year is unknown.
          type: integer
          minimum: 1
          maximum: 2100
        season: { type: integer, minimum: 0, maximum: 65535 }
        episode: { type: integer, minimum: 1, maximum: 65535 }
        episodeTitle: { type: string, maxLength: 200 }
        artist: { type: string, maxLength: 200 }
        album: { type: string, maxLength: 200 }
        track: { type: integer, minimum: 1, maximum: 65535 }
        disc: { type: integer, minimum: 1, maximum: 65535 }
        author: { type: string, maxLength: 200 }
        series: { type: string, maxLength: 200 }
    SemanticMove:
      type: object
      required: [kind, destinationRootId]
      additionalProperties: false
      properties:
        kind: { const: semantic_move }
        destinationRootId: { type: string }
    Tombstone:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind: { const: tombstone }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: { type: object }
